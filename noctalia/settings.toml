config_version = 16

[bar]
order = [ "principal", "direita", "cima", "baixo" ]

    [bar.baixo]
    center = []
    enabled = true
    end = []
    margin_ends = 0
    position = "bottom"
    start = []
    thickness = 15

    [bar.cima]
    center = []
    enabled = true
    end = []
    margin_ends = 0
    start = []
    thickness = 15

    [bar.direita]
    center = []
    enabled = true
    end = []
    margin_ends = 0
    position = "right"
    start = []
    thickness = 15

    [bar.principal]
    end = [ "tray", "group:g1" ]
    margin_ends = 0
    position = "left"
    start = [ "control-center", "workspaces" ]
    thickness = 50

        [[bar.principal.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "launcher", "notifications", "brightness", "volume", "battery", "bluetooth", "network", "session" ]
        opacity = 1.0
        padding = 6.0

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
telemetry_enabled = true

    [shell.screen_corners]
    size = 1

    [shell.shadow]
    alpha = 0.0

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/m4pbj/WallPapers"

    [wallpaper.default]
    path = "/home/m4pbj/WallPapers/pokemon-johto-map-pixelart.png"

    [wallpaper.last]
    path = "/home/m4pbj/WallPapers/pokemon-johto-map-pixelart.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/m4pbj/WallPapers/pokemon-johto-map-pixelart.png"

[widget.control-center]
custom_image_colorize = true
glyph = "brand-debian"

[widget.workspaces]
capsule = true